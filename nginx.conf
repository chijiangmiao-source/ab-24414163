server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 健康路径：静态文件 health 无扩展名，强制为 text/plain
    location = /health {
        default_type text/plain;
        try_files /health =404;
    }

    # SPA 入口
    location / {
        try_files $uri $uri/ /index.html;
    }
}
