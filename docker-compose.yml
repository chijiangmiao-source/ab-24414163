services:
  # 静态站点：宿主机端口可通过环境变量 HOST_PORT 配置（默认 8080）
  web:
    build:
      context: .
      target: runtime
    ports:
      - "${HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # 一次性自动验收：测试 -> 构建 -> 健康 HTTP 冒烟，执行完毕以退出码报告结果
  # 使用：docker compose build verify && docker compose up verify
  verify:
    build:
      context: .
      target: builder
    command: ["npm", "run", "verify"]
    restart: "no"
